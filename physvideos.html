<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فيديوهات الفيزياء - أكاديمية مشكاة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
<script>
try{if(localStorage.getItem('mishkat_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}
</script>
<style>
:root{--blue:#0a84ff;--ink:#101828;--muted:#667085;--card:#fff;--line:#eaeef3;--bgfrom:#e3f4ff;--bgmid:#f4fbff;--bgto:#fffbea;--shadow:rgba(10,132,255,.12);color-scheme:light;
--c1:#0a7ba0;--c2:#0f9bbd;--gold1:#ffc233;--gold2:#ff9f1c;--goldink:#4a3000;--cglow:rgba(6,120,150,.38);--cdeep:#086a8c}
:root[data-theme="dark"]{--ink:#f2f5f8;--muted:#9aa7b6;--card:#16212d;--line:#223041;--bgfrom:#0f2438;--bgmid:#0d141c;--bgto:#0d141c;--shadow:rgba(0,0,0,.35);color-scheme:dark}
body{display:block;padding:34px 5% 44px;min-height:100vh;background:linear-gradient(135deg,var(--bgfrom),var(--bgmid) 60%,var(--bgto));color:var(--ink)}
.wrap{max-width:640px;margin:0 auto;text-align:center}
.logo,h1{color:var(--ink)}
h1{font-size:26px;margin-bottom:4px}
.sub{color:var(--muted);font-size:14px}

/* بطاقات صغيرة */
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px auto 0;max-width:520px}
.vcard{display:flex;flex-direction:column;align-items:center;direction:rtl;text-align:center;padding:10px 8px 12px;border-radius:14px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 8px 18px var(--cglow);transition:transform .2s;cursor:default}
.vcard.clickable{cursor:pointer}
.vcard:hover{transform:translateY(-3px)}
.vcard::before{content:"";position:absolute;left:-30px;bottom:-45px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.vcard>*{position:relative}
.vtag{display:inline-block;max-width:100%;background:linear-gradient(135deg,var(--gold1),var(--gold2));color:var(--goldink);padding:3px 9px;border-radius:999px;font-weight:800;font-size:10.5px;line-height:1.5;box-shadow:0 4px 10px rgba(255,159,28,.4)}
.vico{width:38px;height:38px;margin:6px auto 2px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center}
.vico svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vword{font-size:16px;font-weight:800;line-height:1.2;text-shadow:0 2px 4px rgba(0,60,80,.2)}
.vcard p{color:#fff;font-size:10.5px;line-height:1.5;margin:3px 0 8px;font-weight:500;text-shadow:0 1px 2px rgba(0,60,80,.25);flex:1}
.vact{display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:5px;width:100%}
.vgo{display:inline-block;width:auto;margin:0 auto;padding:6px 12px;border:0;border-radius:999px;background:#fff;color:var(--cdeep);font:inherit;font-size:11px;font-weight:800;cursor:pointer;text-decoration:none;box-shadow:0 6px 14px rgba(0,60,80,.2)}
.vgo:hover,.vgo:focus-visible{background:#e8fbff}
/* أزرار الفيديوهات الإضافية في الأسفل */
.vsmall{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-top:2px}
.vsm{display:inline-block;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--cdeep);font-size:10.5px;font-weight:800;text-decoration:none;box-shadow:0 4px 10px rgba(0,60,80,.18);line-height:1.3}
.vsm:hover,.vsm:focus-visible{background:#fff}

.bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:24px}
.back,.mode{display:inline-block;width:auto;margin:0;padding:7px 18px;border:1.5px solid var(--blue);border-radius:999px;background:var(--card);color:var(--blue);font:inherit;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none}
.back:hover,.back:focus-visible,.mode:hover,.mode:focus-visible{background:var(--blue);color:#fff}
.mock{background:var(--card);border-radius:16px;padding:20px;margin:28px auto 0;max-width:380px;box-shadow:0 20px 50px var(--shadow)}
.mock .l{height:9px;border-radius:6px;background:var(--line);margin-bottom:10px}
.mock .g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.mock .g div{height:90px;border-radius:10px}
.mock .g div:nth-child(1){background:#fff7d6}
.mock .g div:nth-child(2){background:#dff6ff}
.mock .g div:nth-child(3){background:#dcebff}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);max-width:90vw;padding:10px 20px;border-radius:999px;background:var(--card);color:var(--ink);border:1.5px solid var(--blue);box-shadow:0 14px 34px var(--shadow);font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:30;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.vcard{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-book" viewBox="0 0 32 32"><path d="M16 7C13 5 9 4.5 5 5V24C9 23.5 13 24 16 26"/><path d="M16 7C19 5 23 4.5 27 5V24C23 23.5 19 24 16 26"/><path d="M16 7V26"/></symbol>
  <symbol id="i-scale" viewBox="0 0 32 32"><path d="M16 5V26M10 26H22M6 10H26"/><path stroke-width="1.8" d="M8 10L5 18M8 10L11 18M24 10L21 18M24 10L27 18"/><path stroke-width="1.8" d="M4 18A4 4 0 0 0 12 18ZM20 18A4 4 0 0 0 28 18Z"/><circle cx="16" cy="5" r="1.4" fill="#fff" stroke="none"/></symbol>
</svg>

<div class="wrap">
  <div class="logo">أكاديمية مشكاة</div>
  <h1 id="ttl">الفيزياء</h1>
  <p class="sub" id="br">فيديوهات مادة الفيزياء</p>

  <div class="vgrid">

    <article class="vcard" data-k="am">
      <span class="vtag">👩‍🏫 الأستاذة أميرة شنوف</span>
      <div class="vico"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#i-book"/></svg></div>
      <div class="vword">الدرس</div>
      <p class="pl">شرح الدرس بالفيديو</p>
      <div class="vact"><button class="vgo" type="button" data-t="الأستاذة أميرة شنوف" data-n="الدرس">شاهد الآن ←</button></div>
    </article>

    <article class="vcard" data-k="ly">
      <span class="vtag">👩‍🏫 الأستاذة ليديا</span>
      <div class="vico"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#i-book"/></svg></div>
      <div class="vword">الدرس</div>
      <p class="pl">شرح الدرس بالفيديو</p>
      <div class="vact"><button class="vgo" type="button" data-t="الأستاذة ليديا" data-n="الدرس">شاهد الآن ←</button></div>
    </article>

    <article class="vcard" data-k="ab">
      <span class="vtag">👨‍🏫 الأستاذ عبد الله</span>
      <div class="vico"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#i-book"/></svg></div>
      <div class="vword">الدرس</div>
      <p class="pl">شرح الدرس بالفيديو</p>
      <div class="vact"><button class="vgo" type="button" data-t="الأستاذ عبد الله" data-n="الدرس">شاهد الآن ←</button></div>
    </article>

    <article class="vcard" data-k="mz">
      <span class="vtag">📝 تمارين (سلسلة الميزان)</span>
      <div class="vico"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#i-scale"/></svg></div>
      <div class="vword">الميزان</div>
      <p class="pm">حل تمارين سلسلة الميزان بالفيديو</p>
      <div class="vact"><button class="vgo" type="button" data-n="تمارين (سلسلة الميزان)">شاهد الآن ←</button></div>
    </article>

  </div>

  <div class="bar">
    <a class="back" id="backb" href="index.html">← العودة للرئيسية</a>
    <button class="mode" id="mode" type="button">🌙 الوضع الليلي</button>
  </div>

  <div class="mock" aria-hidden="true">
    <div class="l" style="width:70%"></div>
    <div class="l"></div>
    <div class="l" style="width:85%"></div>
    <div class="g"><div></div><div></div><div></div></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="physlinks.js"></script>
<script>
const root=document.documentElement, modeBtn=document.getElementById('mode');
function paint(){
  modeBtn.textContent=root.getAttribute('data-theme')==='dark'?'☀️ الوضع النهاري':'🌙 الوضع الليلي';
}
paint();
modeBtn.onclick=()=>{
  const dark=root.getAttribute('data-theme')==='dark';
  if(dark){root.removeAttribute('data-theme');}else{root.setAttribute('data-theme','dark');}
  try{localStorage.setItem('mishkat_theme',dark?'light':'dark');}catch(e){}
  paint();
};

const toast=document.getElementById('toast');
let tm;
function say(msg){
  toast.textContent=msg;
  toast.classList.add('on');
  clearTimeout(tm);
  tm=setTimeout(()=>toast.classList.remove('on'),2600);
}

const ch=localStorage.getItem('mishkat_chapter')||'';
const br=localStorage.getItem('mishkat_branch')||'';
document.getElementById('ttl').textContent=ch||'الفيزياء';
document.title=(ch||'الفيزياء')+' - أكاديمية مشكاة';
let sub='فيديوهات مادة الفيزياء';
if(br) sub+=' • شعبة '+br;
document.getElementById('br').textContent=sub;

document.querySelectorAll('.pl').forEach(p=>{
  p.textContent=ch?'شرح درس «'+ch+'» بالفيديو':'شرح الدرس بالفيديو';
});
document.querySelectorAll('.pm').forEach(p=>{
  p.textContent=ch?'حل تمارين سلسلة الميزان لدرس «'+ch+'» بالفيديو':'حل تمارين سلسلة الميزان بالفيديو';
});

const key=(typeof PHYS_ALIAS!=='undefined'&&PHYS_ALIAS[ch])||ch;

function ytId(u){
  const m=(u||'').match(/(?:youtu\.be\/|[?&]v=)([A-Za-z0-9_-]{6,})/);
  return m?m[1]:'';
}
function watchUrl(u,label){
  return 'watch.html?v='+encodeURIComponent(ytId(u))+'&t='+encodeURIComponent(label);
}

/* الأستاذة أميرة شنوف: عدة فيديوهات تفتح صفحة الدروس، وفيديو واحد يفتح مباشرة */
const L=(typeof PHYS_LINKS!=='undefined'&&PHYS_LINKS[ch])||[];
const amCard=document.querySelector('.vcard[data-k="am"]');
if(L.length&&amCard){
  const box=amCard.querySelector('.vact');
  box.innerHTML='';
  const a=document.createElement('a');
  a.className='vgo';
  if(L.length===1){
    a.href=watchUrl(L[0].u,'الأستاذة أميرة شنوف — '+ch);
  }else{
    a.href='physlessons.html';
    amCard.querySelector('.pl').textContent='دروس «'+ch+'» في '+L.length+' فيديوهات';
  }
  a.textContent='شاهد الآن ←';
  box.appendChild(a);
}

/* الأستاذة ليديا: البطاقة كلها تفتح الفيديو 1، وفي الأسفل الفيديوهات الأخرى */
(function(){
  const card=document.querySelector('.vcard[data-k="ly"]');
  const arr=(typeof PHYS_LY!=='undefined'&&PHYS_LY[key])||[];
  if(!card||!arr.length) return;
  const box=card.querySelector('.vact');
  box.innerHTML='';
  card.classList.add('clickable');
  const first=arr[0];
  const go=()=>{location.href=watchUrl(first.u,'الأستاذة ليديا — '+first.t);};
  card.addEventListener('click',go);

  const main=document.createElement('span');
  main.className='vgo';
  main.textContent='شاهد الآن ←';
  box.appendChild(main);

  if(arr.length>1){
    const row=document.createElement('div');
    row.className='vsmall';
    arr.slice(1).forEach(v=>{
      const b=document.createElement('a');
      b.className='vsm';
      b.href=watchUrl(v.u,'الأستاذة ليديا — '+v.t);
      b.textContent=v.t;
      b.addEventListener('click',e=>e.stopPropagation());
      row.appendChild(b);
    });
    box.appendChild(row);
  }
})();

/* الأستاذ عبد الله وسلسلة الميزان: رابط مباشر */
function linkify(k,src,label){
  const card=document.querySelector('.vcard[data-k="'+k+'"]');
  const arr=(src&&src[key])||[];
  if(!card||!arr.length) return;
  const box=card.querySelector('.vact');
  box.innerHTML='';
  arr.forEach(l=>{
    const a=document.createElement('a');
    a.className='vgo';
    a.href=watchUrl(l.u,label+' — '+ch);
    a.textContent=(l.t||'شاهد الآن')+' ←';
    box.appendChild(a);
  });
}
linkify('ab',typeof PHYS_AB!=='undefined'?PHYS_AB:null,'الأستاذ عبد الله');
linkify('mz',typeof PHYS_MZ!=='undefined'?PHYS_MZ:null,'تمارين سلسلة الميزان');

/* الأزرار التي لا فيديو لها بعد */
document.querySelectorAll('button.vgo').forEach(b=>{
  b.onclick=()=>{
    const who=b.dataset.t?(' لـ'+b.dataset.t):'';
    say('فيديوهات «'+b.dataset.n+'»'+who+' قيد الإعداد، وستُضاف قريباً ✨');
  };
});
</script>
<script src="about.js"></script>
</body>
</html>
