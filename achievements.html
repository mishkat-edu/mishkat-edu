<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إنجازاتي - أكاديمية مشكاة</title>
<link rel="icon" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mk.css">
<script>try{if(localStorage.getItem('mishkat_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
</head>
<body data-mk="1">
<div class="wrap">
  <div class="pill"><div class="lg">أكاديمية مشكاة</div><h1>إنجازاتي</h1><p>تابع تقدمك الدراسي وأوسمتك</p></div>

  <div class="cd">
    <h2>التقدم الدراسي</h2>
    <div style="display:flex;justify-content:space-between;font-weight:800;font-size:14px"><span id="pt">0%</span><span id="pd" style="color:var(--muted);font-weight:700"></span></div>
    <div class="pg"><i id="pb"></i></div>
  </div>

  <div class="cd">
    <h2>أرقامي</h2>
    <div class="st" id="st"></div>
  </div>

  <div class="cd">
    <h2>الأوسمة والشارات <span class="nm" id="bc">0</span></h2>
    <div class="bd" id="bd"></div>
  </div>

  <div class="cd">
    <h2>النسخ الاحتياطي</h2>
    <p class="mu" style="text-align:right;padding-top:0">بياناتك محفوظة في هذا المتصفح. احفظ نسخة منها لتنقلها إلى جهاز آخر.</p>
    <div class="row">
      <button class="bt o" id="ex" type="button">تصدير بياناتي</button>
      <button class="bt g" id="im" type="button">استيراد نسخة</button>
      <input type="file" id="imf" accept="application/json" hidden>
    </div>
  </div>

  <div class="bar">
    <a class="nb" id="backb" href="index.html">← رجوع</a>
    <a class="nb" href="index.html">🏠 الرئيسية</a>
    <button class="nb" id="mode" type="button">🌙 الوضع الليلي</button>
  </div>
</div>

<script src="mk.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i);};
  var cnt=function(o){return Object.keys(o||{}).length;};
  var A=MK2.get('act',{}), F=MK2.get('focus',{}), P=MK2.get('plan',{}), D=MK2.get('mistakes',{});
  var log=F.log||{}, tasks=P.tasks||[], list=D.list||[];

  var totalMin=0;Object.keys(log).forEach(function(k){totalMin+=log[k];});
  var streak=0,d=new Date();
  if(!(log[MK2.today(d)]>0)) d.setDate(d.getDate()-1);
  while(log[MK2.today(d)]>0){streak++;d.setDate(d.getDate()-1);}

  var s={
    lessons:cnt(A.lessons),sums:cnt(A.sums),exs:cnt(A.exs),vids:cnt(A.vids),
    hours:totalMin/60,
    tasks:tasks.filter(function(t){return t.done;}).length,
    mist:list.length,
    mastered:list.filter(function(m){return m.mastered;}).length,
    streak:streak
  };

  /* التقدم */
  var pct=Math.min(100,Math.round(s.lessons/MK2.TOTAL*100));
  $('pt').textContent=pct+'%';
  $('pd').textContent=s.lessons+' من '+MK2.TOTAL+' درساً';
  setTimeout(function(){$('pb').style.width=pct+'%';},50);

  /* الأرقام */
  var tiles=[
    [s.lessons,'دروس تصفحتها'],[s.sums,'ملخصات فتحتها'],[s.exs,'تمارين فتحتها'],[s.vids,'فيديوهات شاهدتها'],
    [MK2.fmt(totalMin),'وقت الدراسة'],[s.tasks,'مهام منجزة'],[s.mist,'أخطاء سجّلتها'],[s.mastered,'أخطاء أتقنتها'],[s.streak,'أيام متتالية']
  ];
  $('st').innerHTML=tiles.map(function(t){return '<div class="tile"><b>'+t[0]+'</b><span>'+t[1]+'</span></div>';}).join('');

  /* الأوسمة */
  var MEDAL='<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="13" r="8"/><path d="M11 20l-3 9 8-4 8 4-3-9"/><path d="M16 9l1.4 2.8 3.1.4-2.2 2.2.5 3.1-2.8-1.5-2.8 1.5.5-3.1-2.2-2.2 3.1-.4z"/></svg>';
  var COL=['#ff9f1c','#0a84ff','#16a34a','#e11d48'];
  var BADGES=[
    {id:'first',n:'الخطوة الأولى',d:'افتح أول درس',ok:s.lessons>=1},
    {id:'l5',n:'متعلم نشط',d:'تصفّح 5 دروس',ok:s.lessons>=5},
    {id:'l15',n:'طالب مجتهد',d:'تصفّح 15 درساً',ok:s.lessons>=15},
    {id:'s5',n:'قارئ الملخصات',d:'افتح 5 ملخصات',ok:s.sums>=5},
    {id:'e5',n:'حلّال التمارين',d:'افتح 5 ملفات تمارين',ok:s.exs>=5},
    {id:'v5',n:'مشاهد متابع',d:'شاهد 5 فيديوهات',ok:s.vids>=5},
    {id:'f1',n:'ساعة تركيز',d:'ركّز ساعة كاملة',ok:s.hours>=1},
    {id:'f10',n:'عشر ساعات',d:'10 ساعات تركيز',ok:s.hours>=10},
    {id:'t5',n:'منظّم',d:'أنجز 5 مهام',ok:s.tasks>=5},
    {id:'m5',n:'يتعلم من أخطائه',d:'سجّل 5 أخطاء',ok:s.mist>=5},
    {id:'m10',n:'سيد الأخطاء',d:'أتقن 10 أخطاء',ok:s.mastered>=10},
    {id:'st3',n:'ثلاثة أيام',d:'ركّز 3 أيام متتالية',ok:s.streak>=3}
  ];
  var B=MK2.get('badges',{}), got=0, changed=false;
  BADGES.forEach(function(b){
    if(b.ok&&!B[b.id]){B[b.id]=MK2.today();changed=true;}
    if(B[b.id]) got++;
  });
  if(changed) MK2.set('badges',B);
  $('bc').textContent=got+' / '+BADGES.length;
  $('bd').innerHTML=BADGES.map(function(b,i){
    var on=!!B[b.id];
    return '<div class="badge'+(on?' on':'')+'" style="--c:'+COL[i%4]+'">'+MEDAL+'<b>'+b.n+'</b><small>'+(on?('نلتَه في '+B[b.id]):b.d)+'</small></div>';
  }).join('');

  /* النسخ الاحتياطي */
  $('ex').onclick=function(){
    var pre='mk_'+String(MK2.user()).replace(/[^\w\u0600-\u06FF@.\-]/g,'_')+'_', o={};
    for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k.indexOf(pre)===0) o[k]=localStorage.getItem(k);}
    var blob=new Blob([JSON.stringify(o)],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='mishkat-backup.json';
    document.body.appendChild(a);a.click();a.remove();
  };
  $('im').onclick=function(){$('imf').click();};
  $('imf').onchange=function(){
    var f=this.files[0];if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var o=JSON.parse(r.result);
        Object.keys(o).forEach(function(k){if(k.indexOf('mk_')===0) localStorage.setItem(k,o[k]);});
        alert('تم استيراد بياناتك ✓');location.reload();
      }catch(e){alert('الملف غير صالح');}
    };
    r.readAsText(f);
  };
})();
</script>
</body>
</html>
