<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أخطائي وتصحيحها - أكاديمية مشكاة</title>
<link rel="icon" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mk.css">
<script>try{if(localStorage.getItem('mishkat_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
</head>
<body data-mk="1">
<div class="wrap">
  <div class="pill"><div class="lg">أكاديمية مشكاة</div><h1>أخطائي وتصحيحها</h1><p>سجّل أخطاءك وراجعها حتى لا تتكرر</p></div>

  <div class="cd">
    <div class="tabs" id="tb">
      <button type="button" data-v="list" class="on">أخطائي</button>
      <button type="button" data-v="add">إضافة خطأ</button>
      <button type="button" data-v="rev">مراجعة</button>
    </div>

    <!-- قائمة الأخطاء -->
    <div id="v-list">
      <div class="grid2">
        <div><label class="f" for="fs">المادة</label><select id="fs"></select></div>
        <div><label class="f" for="fu">الوحدة</label><select id="fu"></select></div>
      </div>
      <p class="mu" id="cnt"></p>
      <div id="lst"></div>
    </div>

    <!-- إضافة / تعديل -->
    <div id="v-add" hidden>
      <h2 id="ah">إضافة خطأ جديد</h2>
      <div class="grid2">
        <div><label class="f" for="as">المادة</label><select id="as"></select></div>
        <div><label class="f" for="au">الوحدة</label><select id="au"></select></div>
      </div>
      <label class="f" for="aq">السؤال أو التمرين</label><textarea id="aq" placeholder="اكتب نص السؤال"></textarea>
      <label class="f" for="af">صورة السؤال (اختياري)</label><input id="af" type="file" accept="image/*">
      <div id="ap"></div>
      <label class="f" for="aw">إجابتي الخاطئة</label><textarea id="aw"></textarea>
      <label class="f" for="ar">الإجابة الصحيحة</label><textarea id="ar"></textarea>
      <label class="f" for="ay">سبب الخطأ أو ملاحظة تعليمية</label><textarea id="ay"></textarea>
      <div class="row" style="margin-top:12px">
        <button class="bt" id="asv" type="button">حفظ</button>
        <button class="bt g" id="acn" type="button">إلغاء</button>
      </div>
    </div>

    <!-- مراجعة -->
    <div id="v-rev" hidden>
      <p class="mu" id="rc"></p>
      <div id="rv"></div>
    </div>
  </div>

  <div class="bar">
    <a class="nb" id="backb" href="index.html">← رجوع</a>
    <a class="nb" href="index.html">🏠 الرئيسية</a>
    <button class="nb" id="mode" type="button">🌙 الوضع الليلي</button>
  </div>
</div>
<div id="lb" hidden><img alt=""></div>

<script src="mk.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i);};
  var E=MK2.esc, SUB=MK2.SUBJECTS;
  var D=MK2.get('mistakes',{list:[]});D.list=D.list||[];
  var editId=null, img='', pool=[], pi=0;

  function save(){
    if(!MK2.set('mistakes',D)){alert('الذاكرة ممتلئة. احذف بعض الصور ثم أعد المحاولة.');return false;}
    return true;
  }
  function subjName(k){var s=SUB.filter(function(x){return x.k===k;})[0];return s?s.n:'';}
  function fillSubj(sel,all){
    sel.innerHTML=(all?'<option value="">كل المواد</option>':'')+SUB.map(function(s){return '<option value="'+s.k+'">'+s.n+'</option>';}).join('');
  }
  function fillUnits(sel,k,all){
    var s=SUB.filter(function(x){return x.k===k;})[0];
    sel.innerHTML=(all?'<option value="">كل الوحدات</option>':'')+(s?s.u.map(function(u){return '<option value="'+E(u)+'">'+E(u)+'</option>';}).join(''):'');
  }

  fillSubj($('fs'),true);fillUnits($('fu'),'',true);
  fillSubj($('as'),false);fillUnits($('au'),SUB[0].k,false);
  $('fs').onchange=function(){fillUnits($('fu'),$('fs').value,true);renderList();};
  $('fu').onchange=renderList;
  $('as').onchange=function(){fillUnits($('au'),$('as').value,false);};

  function show(v){
    ['list','add','rev'].forEach(function(n){$('v-'+n).hidden=(n!==v);});
    [].forEach.call($('tb').children,function(b){b.classList.toggle('on',b.getAttribute('data-v')===v);});
    if(v==='list') renderList();
    if(v==='rev') startReview();
  }
  [].forEach.call($('tb').children,function(b){b.onclick=function(){if(b.getAttribute('data-v')!=='add') resetForm();show(b.getAttribute('data-v'));};});

  function card(m,review){
    return '<div class="mc">'+
      (m.q?'<div><b>السؤال:</b> '+E(m.q)+'</div>':'')+
      (m.img?'<img src="'+m.img+'" data-a="zoom" alt="صورة السؤال">':'')+
      (review?'':
        (m.w?'<div class="wr"><b>إجابتي الخاطئة:</b> '+E(m.w)+'</div>':'')+
        (m.r?'<div class="rt"><b>الإجابة الصحيحة:</b> '+E(m.r)+'</div>':'')+
        (m.y?'<div class="nt"><b>السبب:</b> '+E(m.y)+'</div>':'')+
        '<div class="ac"><button class="bt g s" type="button" data-a="edit" data-id="'+m.id+'">تعديل</button>'+
        '<button class="bt r s" type="button" data-a="del" data-id="'+m.id+'">حذف</button>'+
        '<button class="bt '+(m.mastered?'o':'g')+' s" type="button" data-a="master" data-id="'+m.id+'">'+(m.mastered?'أتقنتها ✓':'علّمها كمتقنة')+'</button></div>')+
      '</div>';
  }

  function filtered(){
    var s=$('fs').value,u=$('fu').value;
    return D.list.filter(function(m){return (!s||m.s===s)&&(!u||m.u===u);});
  }

  function renderList(){
    var L=filtered();
    $('cnt').textContent=L.length?(L.length+' خطأ'):'';
    if(!L.length){$('lst').innerHTML='<p class="mu">لا توجد أخطاء مسجّلة هنا بعد. اضغط «إضافة خطأ».</p>';return;}
    var out='';
    SUB.forEach(function(s){
      var ms=L.filter(function(m){return m.s===s.k;});
      if(!ms.length) return;
      out+='<details class="grp" open><summary>'+s.n+' <span class="nm">'+ms.length+'</span></summary>';
      var by={};ms.forEach(function(m){(by[m.u]=by[m.u]||[]).push(m);});
      Object.keys(by).forEach(function(u){
        out+='<h3 class="un">'+E(u)+' ('+by[u].length+')</h3>'+by[u].map(function(m){return card(m,false);}).join('');
      });
      out+='</details>';
    });
    $('lst').innerHTML=out;
  }

  $('lst').onclick=function(e){
    var el=e.target.closest('[data-a]');if(!el) return;
    var a=el.getAttribute('data-a');
    if(a==='zoom'){$('lb').querySelector('img').src=el.src;$('lb').hidden=false;return;}
    var id=el.getAttribute('data-id');
    var m=D.list.filter(function(x){return x.id===id;})[0];if(!m) return;
    if(a==='del'){if(confirm('حذف هذا الخطأ؟')){D.list=D.list.filter(function(x){return x.id!==id;});save();renderList();}}
    else if(a==='master'){m.mastered=!m.mastered;save();renderList();}
    else if(a==='edit'){
      editId=id;img=m.img||'';
      $('as').value=m.s;fillUnits($('au'),m.s,false);$('au').value=m.u;
      $('aq').value=m.q||'';$('aw').value=m.w||'';$('ar').value=m.r||'';$('ay').value=m.y||'';
      drawPrev();$('ah').textContent='تعديل الخطأ';show('add');
    }
  };
  $('lb').onclick=function(){$('lb').hidden=true;};

  /* الصورة: تُضغط قبل الحفظ */
  function compress(file,cb){
    var r=new FileReader();
    r.onload=function(){
      var im=new Image();
      im.onload=function(){
        var max=900,k=Math.min(1,max/Math.max(im.width,im.height));
        var c=document.createElement('canvas');
        c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        cb(c.toDataURL('image/jpeg',.7));
      };
      im.src=r.result;
    };
    r.readAsDataURL(file);
  }
  function drawPrev(){
    $('ap').innerHTML=img?('<div class="mc"><img src="'+img+'" alt="" style="cursor:default"><div class="ac"><button class="bt r s" type="button" id="arm">إزالة الصورة</button></div></div>'):'';
    var b=$('arm');if(b) b.onclick=function(){img='';drawPrev();};
  }
  $('af').onchange=function(){
    var f=this.files[0];if(!f) return;
    compress(f,function(d){img=d;drawPrev();});
  };

  function resetForm(){
    editId=null;img='';
    ['aq','aw','ar','ay'].forEach(function(i){$(i).value='';});
    $('af').value='';drawPrev();$('ah').textContent='إضافة خطأ جديد';
  }

  $('asv').onclick=function(){
    var q=$('aq').value.trim();
    if(!q&&!img){alert('اكتب السؤال أو أرفق صورته');return;}
    var o={s:$('as').value,u:$('au').value,q:q,img:img,w:$('aw').value.trim(),r:$('ar').value.trim(),y:$('ay').value.trim()};
    if(editId){
      D.list.forEach(function(m){if(m.id===editId){for(var k in o) m[k]=o[k];}});
    }else{
      o.id=MK2.uid();o.date=MK2.today();o.mastered=false;o.rev=0;D.list.unshift(o);
    }
    if(!save()){if(!editId) D.list.shift();return;}
    resetForm();show('list');
  };
  $('acn').onclick=function(){resetForm();show('list');};

  /* المراجعة: خطأ واحد في كل مرة */
  function startReview(){
    pool=filtered().filter(function(m){return !m.mastered;});
    for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=pool[i];pool[i]=pool[j];pool[j]=t;}
    pi=0;drawReview();
  }
  function drawReview(){
    if(!pool.length||pi>=pool.length){
      $('rc').textContent='';
      $('rv').innerHTML='<p class="mu">'+(pool.length?'أنهيتَ مراجعة كل الأخطاء 👏':'لا توجد أخطاء للمراجعة. أضف أخطاء أو غيّر المادة والوحدة في «أخطائي».')+'</p><div class="row" style="justify-content:center"><button class="bt o" id="rst" type="button">أعد المراجعة</button></div>';
      $('rst').onclick=startReview;return;
    }
    var m=pool[pi];
    $('rc').textContent=(pi+1)+' من '+pool.length+' — '+subjName(m.s)+' / '+m.u;
    $('rv').innerHTML=card(m,true)+
      '<div id="ans" hidden>'+(m.r?'<div class="rt"><b>الإجابة الصحيحة:</b> '+E(m.r)+'</div>':'')+(m.y?'<div class="nt"><b>السبب:</b> '+E(m.y)+'</div>':'')+'</div>'+
      '<div class="row" style="margin-top:12px;justify-content:center">'+
      '<button class="bt o" id="sa" type="button">أظهر الإجابة الصحيحة</button>'+
      '<button class="bt" id="ok" type="button" hidden>فهمتها ✓</button>'+
      '<button class="bt g" id="nx" type="button" hidden>أعدها لاحقاً</button></div>';
    $('sa').onclick=function(){$('ans').hidden=false;$('sa').hidden=true;$('ok').hidden=false;$('nx').hidden=false;};
    $('ok').onclick=function(){bump(m.id,true);pi++;drawReview();};
    $('nx').onclick=function(){bump(m.id,false);pi++;drawReview();};
  }
  function bump(id,mastered){
    D.list.forEach(function(x){if(x.id===id){x.rev=(x.rev||0)+1;if(mastered) x.mastered=true;}});
    save();
  }
  $('rv').onclick=function(e){var el=e.target.closest('[data-a="zoom"]');if(el){$('lb').querySelector('img').src=el.src;$('lb').hidden=false;}};

  renderList();
})();
</script>
</body>
</html>
