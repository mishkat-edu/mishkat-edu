<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الجامعة - أكاديمية مشكاة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem('mishkat_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<style>
:root{--blue:#0a84ff;--ink:#101828;--muted:#667085;--card:#fff;--line:#eaeef3;--bgfrom:#e3f4ff;--bgmid:#f4fbff;--bgto:#fffbea;--shadow:rgba(10,132,255,.12);color-scheme:light}
:root[data-theme="dark"]{--ink:#f2f5f8;--muted:#9aa7b6;--card:#16212d;--line:#223041;--bgfrom:#0f2438;--bgmid:#0d141c;--bgto:#0d141c;--shadow:rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:'Tajawal',system-ui,sans-serif;min-height:100vh;padding:40px 5%;background:linear-gradient(135deg,var(--bgfrom),var(--bgmid) 60%,var(--bgto));color:var(--ink);text-align:center}
.wrap{max-width:640px;margin:0 auto}
.pill{max-width:560px;margin:0 auto;padding:20px 24px;border-radius:46px;background:var(--card);border:3px solid #ffc233;box-shadow:0 0 20px rgba(255,194,51,.35)}
.logo{font-weight:800;font-size:18px}
h1{font-size:30px;margin:6px 0 4px}
.sub{color:var(--muted);margin:0}

#ens{display:none;grid-template-columns:1fr 1fr;gap:12px;max-width:520px;margin:20px auto 0}
#ens.show{display:grid}
.ens{padding:16px 12px;border-radius:20px;background:var(--card);border:2px solid #ffc233;box-shadow:0 10px 24px rgba(255,194,51,.25)}
.uic{width:52px;height:52px;margin:0 auto 8px;border-radius:50%;background:linear-gradient(135deg,#ffc233,#ff9f1c);display:grid;place-items:center;box-shadow:0 8px 16px rgba(255,159,28,.35)}
.uic svg{width:26px;height:26px;fill:none;stroke:#4a3000;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ens-t{font-size:17px;font-weight:800;margin-bottom:6px}
.ens-d{color:var(--muted);font-size:12.5px;line-height:1.7}
.orange-btn{display:inline-block;margin-top:10px;padding:8px 18px;border-radius:999px;border:0;background:linear-gradient(135deg,#ffc233,#ff9f1c);color:#4a3000;font:inherit;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 8px 16px rgba(255,159,28,.35)}

.subs,.tops,.acts{display:none;grid-template-columns:1fr 1fr;gap:14px;margin:26px auto 0;max-width:560px}
.subs.show,.tops.show,.acts.show{display:grid}
.sb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:150px;padding:20px 14px;border-radius:24px;background:var(--card);border:2px solid #ffc233;box-shadow:0 14px 34px rgba(255,194,51,.28);color:var(--ink);font:inherit;font-size:16px;font-weight:800;line-height:1.5;cursor:pointer;transition:transform .2s}
.sb:hover,.sb:focus-visible{transform:translateY(-4px)}
.sb-i{width:56px;height:56px;border-radius:50%;background:linear-gradient(145deg,#4cc3ff,#0a84ff 55%,#1d57d6);display:grid;place-items:center;box-shadow:0 10px 20px rgba(10,132,255,.35),inset 0 1px 0 rgba(255,255,255,.4);color:#fff}
.sb-i svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sb-i .ar{font-size:15px;font-weight:800;line-height:1}
.tops .sb{min-height:118px;font-size:15px;padding:16px 12px;gap:8px}
.tops .sb-i{width:42px;height:42px}
.tops .sb-i .ar{font-size:18px}
.subs .sb:last-child:nth-child(odd),.tops .sb:last-child:nth-child(odd),.acts .sb:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;width:calc(50% - 7px)}

.bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:30px}
.back,.mode{display:inline-block;padding:8px 20px;border:1.5px solid var(--blue);border-radius:999px;background:var(--card);color:var(--blue);font:inherit;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none}
.back:hover,.mode:hover{background:var(--blue);color:#fff}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);max-width:90vw;padding:12px 22px;border-radius:999px;background:var(--card);color:var(--ink);border:1.5px solid #ffc233;box-shadow:0 14px 34px var(--shadow);font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:30}
.toast.on{opacity:1;transform:translate(0,0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="pill">
    <div class="logo">أكاديمية مشكاة</div>
    <h1>الجامعة</h1>
    <p class="sub">محتوى خاص بطلبة الجامعة</p>
  </div>

  <div id="ens" class="show">
    <div class="ens">
      <div class="uic"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 6L3 12l13 6 13-6-13-6Z"/><path d="M8 15v6c0 2 3.6 4 8 4s8-2 8-4v-6"/><path d="M27 12v7"/></svg></div>
      <div class="ens-t">ENS (PEP)</div>
      <div class="ens-d">المدرسة العليا للأساتذة<br>ملمح التعليم الابتدائي<br>السنة الأولى</div>
      <button class="orange-btn" type="button" data-year="1">ابدأ الآن</button>
    </div>
    <div class="ens">
      <div class="uic"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 6L3 12l13 6 13-6-13-6Z"/><path d="M8 15v6c0 2 3.6 4 8 4s8-2 8-4v-6"/><path d="M27 12v7"/></svg></div>
      <div class="ens-t">ENS (PEP2)</div>
      <div class="ens-d">المدرسة العليا للأساتذة<br>ملمح التعليم الابتدائي<br>السنة الثانية</div>
      <button class="orange-btn" type="button" data-year="2">ابدأ الآن</button>
    </div>
  </div>

  <div class="subs" id="subs"></div>
  <div class="tops" id="tops"></div>
  <div class="acts" id="acts"></div>

  <div class="bar">
    <a class="back" id="backb" href="index.html">← العودة للرئيسية</a>
    <button class="mode" id="mode" type="button">🌙 الوضع الليلي</button>
  </div>

  <div class="bar" style="margin-top:24px">
    <a class="back" href="index.html">← العودة للرئيسية</a>
    <button class="mode" id="mode2" type="button">☀️ الوضع النهاري</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var $=function(i){return document.getElementById(i);};
  var root=document.documentElement, modeBtn=$('mode'), modeBtn2=$('mode2');

  function paint(){
    var dark=root.getAttribute('data-theme')==='dark';
    modeBtn.textContent=dark?'☀️ الوضع النهاري':'🌙 الوضع الليلي';
    modeBtn2.textContent=dark?'☀️ الوضع النهاري':'🌙 الوضع الليلي';
  }
  function toggleMode(){
    var d=root.getAttribute('data-theme')==='dark';
    if(d){root.removeAttribute('data-theme');}else{root.setAttribute('data-theme','dark');}
    try{localStorage.setItem('mishkat_theme',d?'light':'dark');}catch(e){}
    paint();
  }
  paint();
  modeBtn.onclick=toggleMode;
  modeBtn2.onclick=toggleMode;

  var toast=$('toast'), tm;
  function say(m){toast.textContent=m;toast.classList.add('on');clearTimeout(tm);tm=setTimeout(function(){toast.classList.remove('on');},2400);}

  var V='<svg viewBox="0 0 32 32" aria-hidden="true">';
  var ICON={
    math:V+'<rect x="7" y="4" width="18" height="24" rx="3"/><path d="M11 10h10M11 15h2M16 15h2M11 20h2M16 20h2M11 25h2M16 25h2"/></svg>',
    physics:V+'<circle cx="16" cy="16" r="2.4" fill="#fff" stroke="none"/><ellipse cx="16" cy="16" rx="12" ry="4.6"/><ellipse cx="16" cy="16" rx="12" ry="4.6" transform="rotate(60 16 16)"/><ellipse cx="16" cy="16" rx="12" ry="4.6" transform="rotate(-60 16 16)"/></svg>',
    chem:V+'<path d="M12 4h8M13 4v8L6 25a2.5 2.5 0 0 0 2.2 3.5h13.6A2.5 2.5 0 0 0 26 25l-7-13V4"/><path d="M10.5 19h11"/></svg>',
    it:V+'<rect x="4" y="6" width="24" height="16" rx="2.5"/><path d="M12 27h8M16 22v5"/><path d="M9 13l3 2-3 2M14 17h4"/></svg>',
    rhetoric:V+'<path d="M6 8a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3h-8l-6 4v-4H9a3 3 0 0 1-3-3z"/><path d="M11 12h10M11 16h6"/></svg>',
    grammar:V+'<path d="M6 26l3-1 13-13a3 3 0 0 0-4-4L5 21z"/><path d="M19 9l4 4"/><path d="M6 30h20"/></svg>',
    literature:V+'<path d="M8 5h14a2 2 0 0 1 2 2v18a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/><path d="M12 11h8M12 15h8M12 19h5"/></svg>',
    islam:V+'<path d="M6 28V16a10 10 0 0 1 20 0v12"/><path d="M4 28h24"/><path d="M16 6V3"/><path d="M14 11h4"/></svg>',
    dictation:V+'<path d="M7 25l1-5L22 6a2.6 2.6 0 0 1 4 4L12 24z"/><path d="M19 9l4 4"/></svg>',
    english:V+'<circle cx="16" cy="16" r="11"/><path d="M5 16h22M16 5c3 3.5 3 18.5 0 22M16 5c-3 3.5-3 18.5 0 22"/></svg>',
    calligraphy:V+'<path d="M22 4c-6 4-10 10-12 18l-3 6 6-3c8-2 14-6 18-12-4-2-6-4-9-9z"/><path d="M10 22l-2 4"/></svg>',
    writing:V+'<path d="M6 26h20"/><path d="M9 22l13-13 4 4-13 13H9z"/><path d="M20 9l4 4"/></svg>',
    computer:V+'<rect x="5" y="6" width="22" height="15" rx="2"/><path d="M12 27h8M16 21v6"/></svg>',
    notes:V+'<path d="M8 5h14a2 2 0 0 1 2 2v18a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/><path d="M11 11h8M11 15h8M11 19h5"/></svg>',
    exam:V+'<circle cx="16" cy="16" r="11"/><path d="M11 16l3.5 3.5L21 12"/></svg>'
  };

  var SUBJECTS1=[
    {n:'الرياضيات',c:'math',ic:ICON.math,topics:['المحور الأول: الاستدلال الرياضي','المحور الثاني: أنشطة عددية','المحور الثالث: أنشطة هندسية']},
    {n:'الفيزياء',c:'phys',ic:ICON.physics,topics:['المحور الأول: المقادير الفيزيائية','المحور الثاني: الأشعة والحساب الشعاعي','المحور الثالث: الحركيات','المحور الرابع: الديناميك','المحور الخامس: العمل والطاقة']},
    {n:'الكيمياء',c:'chem',ic:ICON.chem,topics:null},
    {n:'تكنولوجيا الإعلام والاتصال',c:'ict',ic:ICON.it,topics:['المحور الأول: ماهية تكنولوجيا الإعلام والاتصال','المحور الثالث: بعض تطبيقات تكنولوجيا الإعلام والاتصال','المحور الرابع: انعكاسات التكنولوجيا على الإعلام والاتصال']},
    {n:'البلاغة',c:'rhet',ic:ICON.rhetoric,topics:['الموضوع الأول: مدخل إلى علم البلاغة','الموضوع الثاني: أقسام علم البلاغة','الموضوع الثالث: الحقيقة والمجاز','الموضوع الرابع: التشبيه وأركانه','الموضوع الخامس: الاستعارة وأنواعها']},
    {n:'النحو',c:'gram',ic:ICON.grammar,topics:['الموضوع الأول: تعريف النحو وأهميته','الموضوع الثاني: أقسام الكلام','الموضوع الثالث: الإعراب والبناء في الأسماء']},
    {n:'الصرف',c:'morph',ic:'<span class="ar">ٱ ب ت</span>',topics:['الموضوع الأول: معنى الصرف وميدانه','الموضوع الثاني: الميزان الصرفي','الموضوع الثالث: الصحيح والمعتل في الأفعال','الموضوع الرابع: المجرد والمزيد','الموضوع الخامس: إسناد الفعل الصحيح إلى الضمائر']},
    {n:'الأدب العربي قديماً وحديثاً',c:'lit',ic:ICON.literature,topics:null},
    {n:'الإسلامية',c:'islam',ic:ICON.islam,topics:['الموضوع الأول: الأديان','الموضوع الثاني: مدخل إلى العقيدة الإسلامية','الموضوع الثالث: أركان الإيمان','الموضوع الرابع: الإيمان بالله تعالى','الموضوع الخامس: الإيمان بالملائكة']},
    {n:'الإملاء',c:'dict',ic:ICON.dictation,topics:['اهمية الاملاء واهدافها','العلاقة بين الملاء والكتابة','أنواع الهمزة في أول الكلمة','التاء المفتوحة والمربوطة في الأسماء والأفعال','الحروف المزيدة والمحذوفة','كتابة العدد','علامات الترقيم','الأخطاء الشائعة في الكتابة']},
    {n:'الإنجليزية',c:'eng',ic:ICON.english,topics:['Unit (1): Ethics (أخلاق مهنية)','Unit (2): The world of work and its conflict (عالم العمل وصراعاته)','Unit (3): social media (وسائل التواصل الاجتماعي)','Unit (4): digital marketing (التسويق الرقمي)']},
    {n:'الخط العربي',c:'calli',ic:ICON.calligraphy,topics:null},
    {n:'فنيات الكتابة والتعبير',c:'writ',ic:ICON.writing,topics:['تعريف مقياس فنيات الكتابة والتعبير وتحديد أهم مصطلحاته','خطوات تحرير موضوع','تقنيات كتابة التقرير الكتابي','تقنيات كتابة التقرير الإداري','التعبير الشفهي','قراءة نصوص عربية وفك رموزها','فنيات كتابة المقال وأساليب الكتابة الإيضاحية والإقناعية']},
    {n:'أعلام آلي',c:'comp',ic:ICON.computer,topics:null}
  ];

  var SUBJECTS2=[
    {n:'النحو العربي',c:'gram2',ic:ICON.grammar,topics:null},
    {n:'علم النفس',c:'psy',ic:ICON.notes,topics:null},
    {n:'الصرف',c:'morph2',ic:'<span class="ar">ٱ ب ت</span>',topics:null},
    {n:'قضايا النقد العربي ق و ح',c:'crit',ic:ICON.literature,topics:null},
    {n:'الرياضيات',c:'math2',ic:ICON.math,topics:null},
    {n:'علم الأحياء',c:'bio',ic:ICON.chem,topics:null},
    {n:'التربية الإسلامية',c:'islam2',ic:ICON.islam,topics:null},
    {n:'لسانيات عامة',c:'ling',ic:ICON.rhetoric,topics:null}
  ];

  var ens=$('ens'), subs=$('subs'), tops=$('tops'), acts=$('acts'), back=$('backb');
  var view='ens', YEAR=1, SUBJ=SUBJECTS1;

  function show(v){
    view=v;
    ens.classList.toggle('show',v==='ens');
    subs.classList.toggle('show',v==='subs');
    tops.classList.toggle('show',v==='topics');
    acts.classList.toggle('show',v==='acts');
    if(v==='ens'){back.textContent='← العودة للرئيسية';back.setAttribute('href','index.html');}
    else{back.textContent='← رجوع';back.setAttribute('href','#');}
  }

  function card(box,label,icon,num,onclick){
    var b=document.createElement('button');
    b.type='button';
    b.className='sb';
    var i=document.createElement('span');
    i.className='sb-i';
    if(num){i.innerHTML='<span class="ar">'+num+'</span>';}else{i.innerHTML=icon;}
    var t=document.createElement('span');
    t.textContent=label;
    b.appendChild(i);
    b.appendChild(t);
    b.onclick=onclick;
    box.appendChild(b);
  }

  function openPdf(cands,title,msg){
    (function next(k){
      if(k>=cands.length){say(msg);return;}
      fetch(cands[k],{method:'HEAD',cache:'no-store'}).then(function(r){
        if(r.ok){location.href='pdfview.html?f='+encodeURIComponent(cands[k])+'&t='+encodeURIComponent(title);}
        else{next(k+1);}
      }).catch(function(){next(k+1);});
    })(0);
  }

  function buildSubjects(){
    subs.innerHTML='';
    SUBJ.forEach(function(s){
      card(subs,s.n,s.ic,null,function(){
        tops.innerHTML='';
        if(!s.topics){
          card(tops,'قيد الإعداد',ICON.calligraphy,null,function(){say('«'+s.n+'» قيد الإعداد ✨');});
        }else{
          s.topics.forEach(function(t,k){
            card(tops,t,null,String(k+1),function(){
              acts.innerHTML='';
              var pre='ens'+YEAR;
              card(acts,'الملخصات',ICON.notes,null,function(){
                openPdf([pre+'-'+s.c+'-'+(k+1)+'.pdf',pre+'-'+s.c+'.pdf'],'ملخص '+t,'ملخصات «'+t+'» قيد الإعداد ✨');
              });
              card(acts,'التمارين والتصحيح (الاختبارات)',ICON.exam,null,function(){
                openPdf([pre+'-ex-'+s.c+'-'+(k+1)+'.pdf',pre+'-ex-'+s.c+'.pdf'],'تمارين '+t,'تمارين «'+t+'» قيد الإعداد ✨');
              });
              show('acts');
            });
          });
        }
        show('topics');
      });
    });
  }

  document.querySelectorAll('[data-year]').forEach(function(btn){
    btn.onclick=function(){
      YEAR=parseInt(btn.getAttribute('data-year'),10)||1;
      SUBJ=(YEAR===2)?SUBJECTS2:SUBJECTS1;
      buildSubjects();
      show('subs');
    };
  });

  back.addEventListener('click',function(e){
    if(view==='acts'){e.preventDefault();show('topics');return;}
    if(view==='topics'){e.preventDefault();show('subs');return;}
    if(view==='subs'){e.preventDefault();show('ens');}
  });
})();
</script>
<script src="about.js"></script>
</body>
</html>
